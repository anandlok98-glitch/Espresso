<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AURA Espresso Lab</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX Compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #000; color: #f4f4f5; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
  </style>
</head>
<body class="bg-black text-zinc-100 selection:bg-red-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconElem = window.lucide.createElement(window.lucide.icons[name] || window.lucide.icons['Coffee']);
          if (iconElem) {
            iconElem.setAttribute('class', className);
            ref.current.appendChild(iconElem);
          }
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" />;
    };

    const INITIAL_LOGS = [
      {
        id: "log-1",
        roaster: "Onyx Coffee Lab",
        beanName: "Monarch",
        origin: "Guatemala & Colombia",
        roastLevel: "Medium-Dark",
        grindSetting: "12.5 (Fine)",
        tempC: 93,
        tempF: 199.4,
        doseGrams: 18.0,
        yieldGrams: 36.0,
        preInfusionPumpOnSec: 4,
        preInfusionPumpOffSec: 3,
        targetTimeSec: 28,
        flavorNotes: ["Dark Chocolate", "Molasses", "Dried Berries"],
        rating: 5,
        notes: "Rich crema with syrupy body. 4s pump saturation prevents puck channeling.",
        date: "2026-08-15"
      },
      {
        id: "log-2",
        roaster: "Square Mile Coffee",
        beanName: "Red Brick",
        origin: "Costa Rica & Ethiopia",
        roastLevel: "Medium-Light",
        grindSetting: "10.0 (Very Fine)",
        tempC: 95,
        tempF: 203.0,
        doseGrams: 18.5,
        yieldGrams: 42.0,
        preInfusionPumpOnSec: 6,
        preInfusionPumpOffSec: 5,
        targetTimeSec: 32,
        flavorNotes: ["Sweet Nectarine", "Milk Chocolate", "Red Apple"],
        rating: 4,
        notes: "Light roast needed a 5s pump-off soak to open fruit sweetness.",
        date: "2026-08-12"
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('analyser');
      const [logs, setLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('espresso_coffee_logs');
          return saved ? JSON.parse(saved) : INITIAL_LOGS;
        } catch (e) {
          return INITIAL_LOGS;
        }
      });

      const [customApiKey, setCustomApiKey] = useState(() => {
        try {
          return localStorage.getItem('espresso_gemini_key') || '';
        } catch (e) {
          return '';
        }
      });

      const [showKeyModal, setShowKeyModal] = useState(false);
      const [keyInput, setKeyInput] = useState('');
      const [toastMessage, setToastMessage] = useState(null);

      const [bagImages, setBagImages] = useState([]);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisResult, setAnalysisResult] = useState(null);
      const [analysisError, setAnalysisError] = useState(null);

      const [showSaveModal, setShowSaveModal] = useState(false);
      const [showManualModal, setShowManualModal] = useState(false);
      const [editLogData, setEditLogData] = useState(null);

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedRoastFilter, setSelectedRoastFilter] = useState('All');

      useEffect(() => {
        try {
          localStorage.setItem('espresso_coffee_logs', JSON.stringify(logs));
        } catch (e) {}
      }, [logs]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const saveCustomKey = (key) => {
        const cleaned = key.trim();
        setCustomApiKey(cleaned);
        try {
          localStorage.setItem('espresso_gemini_key', cleaned);
        } catch (e) {}
        setShowKeyModal(false);
        showToast('API Key saved to browser!');
      };

      const handleImageUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        if (bagImages.length + files.length > 2) {
          showToast('Maximum 2 images allowed (Front/Back)');
          return;
        }
        files.slice(0, 2 - bagImages.length).forEach(file => {
          const reader = new FileReader();
          reader.onload = () => {
            setBagImages(prev => [...prev, {
              mimeType: file.type || 'image/jpeg',
              base64: reader.result.split(',')[1],
              previewUrl: reader.result,
              name: file.name
            }]);
          };
          reader.readAsDataURL(file);
        });
      };

      const removeImage = (idx) => {
        setBagImages(prev => prev.filter((_, i) => i !== idx));
      };

      const analyzeCoffeeBag = async () => {
        const key = (customApiKey || '').trim();
        if (!key) {
          setShowKeyModal(true);
          showToast('Please enter your Gemini API Key first');
          return;
        }
        if (bagImages.length === 0) {
          setAnalysisError('Please upload at least one image of your coffee bag.');
          return;
        }

        setIsAnalyzing(true);
        setAnalysisError(null);
        setAnalysisResult(null);

        const promptText = `Analyze this coffee bag image and output baseline ESPRESSO parameters. NEVER output filter or drip brewing specs. Return ONLY raw JSON without backticks matching:
{
  "roaster": "Company Name",
  "beanName": "Name of coffee / single origin",
  "origin": "Country / Region of origin",
  "roastLevel": "Light, Medium-Light, Medium, Medium-Dark, or Dark",
  "flavorNotes": ["Tag1", "Tag2", "Tag3"],
  "suggestedTempC": 93,
  "suggestedTempF": 199.4,
  "suggestedDoseGrams": 18.0,
  "suggestedYieldGrams": 36.0,
  "suggestedTargetTimeSec": 28,
  "preInfusionPumpOnSec": 4,
  "preInfusionPumpOffSec": 4,
  "grindSettingAdvice": "Advice on grind size relative to standard baseline",
  "dialInRationale": "Why these parameters suit this specific roast and origin"
}`;

        const contentsParts = [{ text: promptText }];
        bagImages.forEach(img => {
          contentsParts.push({
            inlineData: { mimeType: img.mimeType, data: img.base64 }
          });
        });

        const payload = {
          contents: [{ parts: contentsParts }]
        };

        // Determine if using Google AQ Bearer Token or legacy AIza key
        const isBearerAuth = key.startsWith('AQ.');

        const modelList = ['gemini-2.0-flash', 'gemini-1.5-flash', 'gemini-1.5-pro'];
        let success = false;
        let lastErr = null;

        for (const model of modelList) {
          const authVariations = isBearerAuth ? [
            {
              url: `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${key}`
              }
            },
            {
              url: `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
              headers: {
                'Content-Type': 'application/json'
              }
            }
          ] : [
            {
              url: `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
              headers: { 'Content-Type': 'application/json' }
            }
          ];

          for (const attempt of authVariations) {
            try {
              const res = await fetch(attempt.url, {
                method: 'POST',
                headers: attempt.headers,
                body: JSON.stringify(payload)
              });

              if (!res.ok) {
                const errJson = await res.json().catch(() => ({}));
                lastErr = new Error(errJson.error?.message || `HTTP ${res.status}`);
                continue;
              }

              const data = await res.json();
              let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (!rawText) continue;

              rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
              const parsed = JSON.parse(rawText);
              setAnalysisResult(parsed);
              success = true;
              break;
            } catch (err) {
              lastErr = err;
            }
          }
          if (success) break;
        }

        if (!success) {
          setAnalysisError(lastErr?.message || 'Failed to analyze coffee bag with provided key.');
        }
        setIsAnalyzing(false);
      };

      const handleSaveLog = (item) => {
        setLogs(prev => {
          const idx = prev.findIndex(l => l.id === item.id);
          if (idx >= 0) {
            const updated = [...prev];
            updated[idx] = item;
            return updated;
          }
          return [item, ...prev];
        });
        setShowSaveModal(false);
        setShowManualModal(false);
        showToast('Espresso recipe saved!');
      };

      const filteredLogs = logs.filter(log => {
        const matchesSearch = 
          log.roaster?.toLowerCase().includes(searchQuery.toLowerCase()) ||
          log.beanName?.toLowerCase().includes(searchQuery.toLowerCase()) ||
          log.origin?.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesRoast = selectedRoastFilter === 'All' || log.roastLevel?.toLowerCase().includes(selectedRoastFilter.toLowerCase());
        return matchesSearch && matchesRoast;
      });

      return (
        <div className="min-h-screen pb-20 relative overflow-hidden">
          <div className="fixed inset-0 pointer-events-none z-0">
            <div className="absolute -top-40 left-1/2 -translate-x-1/2 w-[550px] h-[550px] bg-red-900/20 rounded-full blur-[140px]" />
          </div>

          <header className="sticky top-0 z-40 backdrop-blur-2xl bg-zinc-950/80 border-b border-red-950/40 px-4 lg:px-8 py-3">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-red-600 to-red-950 p-[1px]">
                  <div className="w-full h-full bg-zinc-950 rounded-[15px] flex items-center justify-center">
                    <Icon name="Coffee" className="w-5 h-5 text-red-500" />
                  </div>
                </div>
                <div>
                  <h1 className="text-base font-bold tracking-wider text-white flex items-center gap-2">
                    AURA <span className="text-[10px] px-2 py-0.5 rounded-full bg-red-950 text-red-400 border border-red-800/40 uppercase font-mono">Espresso</span>
                  </h1>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <nav className="flex p-1 bg-zinc-900/90 rounded-2xl border border-zinc-800">
                  <button
                    onClick={() => setActiveTab('analyser')}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                      activeTab === 'analyser' ? 'bg-red-600 text-white shadow-[0_0_12px_rgba(220,38,38,0.4)]' : 'text-zinc-400'
                    }`}
                  >
                    <Icon name="Sparkles" className="w-3.5 h-3.5" />
                    <span>Analyser</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('log')}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                      activeTab === 'log' ? 'bg-red-600 text-white shadow-[0_0_12px_rgba(220,38,38,0.4)]' : 'text-zinc-400'
                    }`}
                  >
                    <Icon name="Coffee" className="w-3.5 h-3.5" />
                    <span>Coffee Log</span>
                  </button>
                </nav>

                <button
                  onClick={() => { setKeyInput(customApiKey); setShowKeyModal(true); }}
                  className="p-2 rounded-2xl bg-zinc-900 border border-zinc-800 text-red-400 hover:text-white"
                  title="API Key"
                >
                  <Icon name="Key" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-zinc-900 border border-red-500/40 px-4 py-3 rounded-2xl text-xs font-medium backdrop-blur-xl shadow-2xl">
              {toastMessage}
            </div>
          )}

          <main className="relative z-10 max-w-6xl mx-auto px-4 lg:px-8 py-6">
            {activeTab === 'analyser' ? (
              <div className="space-y-6">
                <div className="rounded-3xl bg-zinc-950/70 border border-red-900/30 p-6 backdrop-blur-2xl">
                  <span className="text-xs font-bold text-red-500 uppercase tracking-wider block mb-1">AI Machine Dial-In</span>
                  <h2 className="text-2xl font-bold text-white">Espresso Baseline Generator</h2>
                  <p className="text-xs text-zinc-400 mt-1 max-w-xl">
                    Upload photos of your coffee bag. Gemini calculates your baseline water temp, dose/yield, and pre-infusion pump timing.
                  </p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-5 bg-zinc-950/70 border border-zinc-800 rounded-3xl p-5 space-y-4">
                    <div className="flex justify-between items-center text-xs text-zinc-400">
                      <span>Photos ({bagImages.length}/2)</span>
                    </div>

                    {bagImages.length < 2 && (
                      <label className="border-2 border-dashed border-zinc-800 hover:border-red-600 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer transition-all">
                        <Icon name="UploadCloud" className="w-8 h-8 text-zinc-500 mb-2" />
                        <span className="text-xs text-zinc-300 font-medium">Upload Front / Back Label</span>
                        <input type="file" accept="image/*" multiple onChange={handleImageUpload} className="hidden" />
                      </label>
                    )}

                    {bagImages.length > 0 && (
                      <div className="grid grid-cols-2 gap-2">
                        {bagImages.map((img, i) => (
                          <div key={i} className="relative rounded-xl overflow-hidden aspect-square border border-zinc-800 group">
                            <img src={img.previewUrl} className="w-full h-full object-cover" />
                            <button onClick={() => removeImage(i)} className="absolute top-1 right-1 p-1.5 bg-red-600 text-white rounded-lg">
                              <Icon name="X" className="w-3 h-3" />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}

                    <button
                      onClick={analyzeCoffeeBag}
                      disabled={isAnalyzing || bagImages.length === 0}
                      className={`w-full py-3.5 rounded-2xl font-bold text-xs tracking-wide flex items-center justify-center gap-2 ${
                        isAnalyzing || bagImages.length === 0 ? 'bg-zinc-800 text-zinc-500' : 'bg-red-600 hover:bg-red-500 text-white shadow-[0_0_20px_rgba(220,38,38,0.4)]'
                      }`}
                    >
                      <Icon name="Sparkles" className="w-4 h-4" />
                      <span>{isAnalyzing ? 'Analyzing Beans...' : 'Assess Baseline Espresso Brew'}</span>
                    </button>

                    {analysisError && <div className="text-xs text-red-400 bg-red-950/40 p-3 rounded-xl border border-red-800/40">{analysisError}</div>}
                  </div>

                  <div className="lg:col-span-7">
                    {analysisResult ? (
                      <div className="bg-zinc-950/80 border border-red-900/40 rounded-3xl p-6 space-y-5">
                        <div className="border-b border-zinc-800 pb-4">
                          <span className="text-[10px] uppercase font-bold text-red-500 tracking-wider">{analysisResult.roaster}</span>
                          <h3 className="text-xl font-bold text-white">{analysisResult.beanName}</h3>
                          <p className="text-xs text-zinc-400">{analysisResult.origin} • {analysisResult.roastLevel} Roast</p>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
                          <div className="bg-zinc-900 p-3 rounded-xl border border-zinc-800">
                            <span className="text-[10px] text-zinc-500 block">Temp</span>
                            <span className="text-base font-bold text-white">{analysisResult.suggestedTempC}°C</span>
                          </div>
                          <div className="bg-zinc-900 p-3 rounded-xl border border-zinc-800">
                            <span className="text-[10px] text-zinc-500 block">Dose / Yield</span>
                            <span className="text-base font-bold text-white">{analysisResult.suggestedDoseGrams}g → {analysisResult.suggestedYieldGrams}g</span>
                          </div>
                          <div className="bg-zinc-900 p-3 rounded-xl border border-zinc-800">
                            <span className="text-[10px] text-zinc-500 block">Pump ON</span>
                            <span className="text-base font-bold text-white">{analysisResult.preInfusionPumpOnSec}s</span>
                          </div>
                          <div className="bg-zinc-900 p-3 rounded-xl border border-zinc-800">
                            <span className="text-[10px] text-zinc-500 block">Pump OFF</span>
                            <span className="text-base font-bold text-white">{analysisResult.preInfusionPumpOffSec}s</span>
                          </div>
                        </div>

                        <div className="bg-zinc-900/60 p-3.5 rounded-xl border border-zinc-800 text-xs">
                          <span className="text-red-400 font-semibold block mb-1">Grind Setting Advice</span>
                          <p className="text-zinc-300">{analysisResult.grindSettingAdvice}</p>
                        </div>

                        <div className="bg-zinc-900/60 p-3.5 rounded-xl border border-zinc-800 text-xs">
                          <span className="text-zinc-400 font-semibold block mb-1">Dial-In Rationale</span>
                          <p className="text-zinc-400">{analysisResult.dialInRationale}</p>
                        </div>

                        <button
                          onClick={() => {
                            setEditLogData({
                              id: "log-" + Date.now(),
                              roaster: analysisResult.roaster || "",
                              beanName: analysisResult.beanName || "",
                              origin: analysisResult.origin || "",
                              roastLevel: analysisResult.roastLevel || "Medium",
                              grindSetting: "Fine baseline",
                              tempC: analysisResult.suggestedTempC || 93,
                              tempF: analysisResult.suggestedTempF || 199.4,
                              doseGrams: analysisResult.suggestedDoseGrams || 18,
                              yieldGrams: analysisResult.suggestedYieldGrams || 36,
                              preInfusionPumpOnSec: analysisResult.preInfusionPumpOnSec || 4,
                              preInfusionPumpOffSec: analysisResult.preInfusionPumpOffSec || 4,
                              targetTimeSec: analysisResult.suggestedTargetTimeSec || 30,
                              flavorNotes: analysisResult.flavorNotes || [],
                              rating: 5,
                              notes: analysisResult.dialInRationale || "",
                              date: new Date().toISOString().split('T')[0]
                            });
                            setShowSaveModal(true);
                          }}
                          className="w-full py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs tracking-wider uppercase"
                        >
                          Save to Coffee Log
                        </button>
                      </div>
                    ) : (
                      <div className="h-64 border border-dashed border-zinc-800 rounded-3xl flex flex-col items-center justify-center text-center p-6 text-zinc-500 text-xs">
                        <Icon name="Sliders" className="w-8 h-8 text-zinc-600 mb-2" />
                        <span>Awaiting bag photo analysis</span>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ) : (
              <div className="space-y-4">
                <div className="flex justify-between items-center bg-zinc-950 p-4 rounded-2xl border border-zinc-800">
                  <h2 className="text-base font-bold text-white">Espresso Brew Journal ({filteredLogs.length})</h2>
                  <button
                    onClick={() => {
                      setEditLogData({
                        id: "log-" + Date.now(),
                        roaster: "",
                        beanName: "",
                        origin: "",
                        roastLevel: "Medium",
                        grindSetting: "14.0",
                        tempC: 93,
                        tempF: 199.4,
                        doseGrams: 18.0,
                        yieldGrams: 36.0,
                        preInfusionPumpOnSec: 4,
                        preInfusionPumpOffSec: 4,
                        targetTimeSec: 30,
                        flavorNotes: [],
                        rating: 5,
                        notes: "",
                        date: new Date().toISOString().split('T')[0]
                      });
                      setShowManualModal(true);
                    }}
                    className="px-3 py-1.5 rounded-xl bg-red-600 text-white font-bold text-xs"
                  >
                    + Add Entry
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {filteredLogs.map(log => (
                    <div key={log.id} className="bg-zinc-950 p-4 rounded-2xl border border-zinc-800 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[10px] uppercase font-bold text-red-500">{log.roaster}</span>
                          <h4 className="text-base font-bold text-white">{log.beanName}</h4>
                          <p className="text-[11px] text-zinc-400">{log.origin} • {log.roastLevel}</p>
                        </div>
                        <span className="text-amber-400 text-xs font-bold">★ {log.rating}/5</span>
                      </div>

                      <div className="grid grid-cols-3 gap-2 text-center text-xs py-2 border-y border-zinc-900">
                        <div>
                          <span className="text-[10px] text-zinc-500 block">Grind</span>
                          <span className="font-bold">{log.grindSetting}</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-zinc-500 block">Temp</span>
                          <span className="font-bold">{log.tempC}°C</span>
                        </div>
                        <div>
                          <span className="text-[10px] text-zinc-500 block">Ratio</span>
                          <span className="font-bold">{log.doseGrams}g → {log.yieldGrams}g</span>
                        </div>
                      </div>

                      <div className="text-[11px] text-zinc-400">
                        Pump: <strong className="text-white">{log.preInfusionPumpOnSec}s ON</strong> / <strong className="text-white">{log.preInfusionPumpOffSec}s OFF</strong>
                      </div>

                      {log.notes && <p className="text-[11px] text-zinc-400 italic">"{log.notes}"</p>}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {showKeyModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-sm bg-zinc-950 border border-zinc-800 p-5 rounded-2xl space-y-4">
                <h3 className="text-sm font-bold text-white">Gemini API Key</h3>
                <input
                  type="password"
                  value={keyInput}
                  onChange={(e) => setKeyInput(e.target.value)}
                  placeholder="AQ.Ab8RN..."
                  className="w-full px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-white"
                />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowKeyModal(false)} className="px-3 py-1.5 text-xs text-zinc-400">Cancel</button>
                  <button onClick={() => saveCustomKey(keyInput)} className="px-4 py-1.5 rounded-xl bg-red-600 text-white text-xs font-bold">Save Key</button>
                </div>
              </div>
            </div>
          )}

          {(showSaveModal || showManualModal) && editLogData && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md max-h-[90vh] overflow-y-auto bg-zinc-950 border border-zinc-800 p-5 rounded-2xl space-y-3 text-xs">
                <h3 className="text-sm font-bold text-white">Save Espresso Specs</h3>
                <input
                  type="text"
                  placeholder="Roaster"
                  value={editLogData.roaster}
                  onChange={(e) => setEditLogData({...editLogData, roaster: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-white"
                />
                <input
                  type="text"
                  placeholder="Bean Name"
                  value={editLogData.beanName}
                  onChange={(e) => setEditLogData({...editLogData, beanName: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-white"
                />
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="Grind setting"
                    value={editLogData.grindSetting}
                    onChange={(e) => setEditLogData({...editLogData, grindSetting: e.target.value})}
                    className="px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-white"
                  />
                  <input
                    type="number"
                    placeholder="Temp °C"
                    value={editLogData.tempC}
                    onChange={(e) => setEditLogData({...editLogData, tempC: parseFloat(e.target.value) || 93})}
                    className="px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-white"
                  />
                </div>
                <textarea
                  placeholder="Barista notes..."
                  value={editLogData.notes}
                  onChange={(e) => setEditLogData({...editLogData, notes: e.target.value})}
                  className="w-full px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-white"
                />
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => { setShowSaveModal(false); setShowManualModal(false); }} className="px-3 py-1.5 text-zinc-400">Cancel</button>
                  <button onClick={() => handleSaveLog(editLogData)} className="px-4 py-1.5 rounded-xl bg-red-600 text-white font-bold">Save Log</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
